<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>产品目录 · 中医养生茶饮</title>
<meta name="description" content="中医养生茶饮产品目录：代茶饮、膏方、合香香疗、药食同源等养生好物，含规格、会员价与适合体质。">
<link rel="stylesheet" href="css/product-public.css">
</head>
<body>
<header class="pp-head">

  <div class="pp-sub">产品目录 · 养生好物一览</div>
  <div class="pp-search">
    <span class="pp-search-ico">🔍</span>

  <div class="pp-bar">
    <div class="pp-cats" id="pp-cats"></div>

<main id="pp-list" class="pp-list"></main>
<footer class="pp-foot">本页为对外展示，资料随店内更新自动同步 · 到店选购更优惠</footer>
<div class="pp-lightbox" id="pp-lightbox" onclick="PP.closeZoom()"><img id="pp-lightbox-img" src="" alt=""></div>
